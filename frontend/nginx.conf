server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # L'API NestJS est jointe via le réseau Docker (service "backend")
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # SPA : toute route inconnue renvoie index.html (le routeur Angular prend le relais)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
