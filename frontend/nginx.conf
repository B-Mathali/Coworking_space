server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Les images d'espaces peuvent faire jusqu'à 5 Mo (limite nginx par défaut : 1 Mo)
  client_max_body_size 10m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # L'API NestJS est jointe via le réseau Docker (service "backend")
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Images uploadées servies par le backend (express.static sur /uploads)
  location /uploads/ {
    proxy_pass http://backend:3000/uploads/;
    proxy_set_header Host $host;
  }

  # Fichiers Angular hashés : cache long
  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA : toute route inconnue renvoie index.html (le routeur Angular prend le relais)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
