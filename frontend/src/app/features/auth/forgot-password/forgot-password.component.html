<app-auth-shell eyebrow="Accès au compte" title="Mot de passe oublié ?" subtitle="Saisissez votre email : nous vous enverrons un lien pour en choisir un nouveau.">
  @if (sentMessage(); as m) {
    <div class="alert alert-success"><app-icon name="check-circle" [size]="17" /> <span>{{ m }} Pensez à vérifier vos courriers indésirables.</span></div>
  } @else {
    @if (error(); as e) {
      <div class="alert alert-error"><app-icon name="alert-circle" [size]="17" /> <span>{{ e }}</span></div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="form-group">
        <label for="email">Adresse email</label>
        <div class="input-icon">
          <span class="i-lead"><app-icon name="mail" [size]="17" /></span>
          <input id="email" type="email" formControlName="email" autocomplete="email" placeholder="vous@exemple.com" />
        </div>
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <div class="field-error"><app-icon name="alert-circle" [size]="13" /> Email invalide.</div>
        }
      </div>

      <button class="btn btn-primary btn-lg btn-block mt" type="submit" [disabled]="loading()">
        @if (loading()) { Envoi… } @else { Envoyer le lien <app-icon name="arrow-right" [size]="17" /> }
      </button>
    </form>
  }

  <p class="muted small mt" style="text-align: center; margin-top: 1.5rem">
    <a routerLink="/login" class="strong" style="color: var(--primary)">Retour à la connexion</a>
  </p>
</app-auth-shell>
