<app-auth-shell title="Bon retour" subtitle="Connectez-vous pour réserver votre place.">
  @if (error(); as e) {
    <div class="alert alert-error"><app-icon name="alert-circle" [size]="17" /> <span>{{ e }}</span></div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="form-group">
      <label for="email">Adresse email</label>
      <div class="input-icon">
        <span class="i-lead"><app-icon name="mail" [size]="17" /></span>
        <input id="email" type="email" formControlName="email" autocomplete="email" placeholder="vous@exemple.com" />
      </div>
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <div class="field-error"><app-icon name="alert-circle" [size]="13" /> Email invalide.</div>
      }
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <div class="input-icon">
        <span class="i-lead"><app-icon name="lock" [size]="17" /></span>
        <input id="password" [type]="showPwd() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
        <button type="button" class="i-trail btn btn-ghost btn-sm btn-icon" (click)="showPwd.set(!showPwd())" [attr.aria-label]="showPwd() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
          <app-icon [name]="showPwd() ? 'eye-off' : 'eye'" [size]="16" />
        </button>
      </div>
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <div class="field-error"><app-icon name="alert-circle" [size]="13" /> 6 caractères minimum.</div>
      }
    </div>

    <button class="btn btn-primary btn-lg btn-block mt" type="submit" [disabled]="loading()">
      @if (loading()) { Connexion… } @else { Se connecter <app-icon name="arrow-right" [size]="17" /> }
    </button>
  </form>

  <p class="muted small mt" style="text-align: center; margin-top: 1.5rem">
    Pas encore de compte ? <a routerLink="/register" class="strong" style="color: var(--primary)">Créer un compte</a>
  </p>
</app-auth-shell>
